name: BSDs
on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_bsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - uses: vmactions/freebsd-vm@v1
      with:
        release: "15.0"
        usesh: true
        sync: nfs
        copyback: false
        # The default 6GB VM dies on the OOM killer ("Subprocess killed",
        # no compiler diagnostic) near the end of the build, first seen on
        # the VST3 SDK TUs around step 4039/4104 - the job had never
        # compiled that far before 30fe1d771 fixed its shebang.
        mem: 8192
        prepare: |
          # 8GB was still not enough for the tail of the build (the VM died
          # mid-compile on the same VST3 SDK / puppet TU cluster, moving from
          # step 4039 to 4042 of 4104): give the guest swap to absorb the
          # peak instead of dying, at zero cost while unused.
          # dd, not truncate: FreeBSD swapon silently does not engage on a
          # sparse vnode (the first attempt left only the image's 1GB
          # partition in swapinfo).
          echo "=============== FreeBSD Start swap ====================="
          dd if=/dev/zero of=/swapfile bs=1m count=6144
          chmod 0600 /swapfile
          mdconfig -a -t vnode -f /swapfile -u 9
          swapon /dev/md9
          swapinfo
          swapinfo | grep -q md9 || echo "WARNING: swap file not engaged"
          echo "=============== FreeBSD Start update ====================="
          pkg update -f -q
          echo "=============== FreeBSD Start upgrade ====================="
          pkg upgrade -y
          echo "=============== FreeBSD Start install ====================="
          pkg install -y \
            bash \
            boost-libs \
            cmake git \
            llvm19 \
            ninja \
            qt6-base qt6-declarative qt6-shadertools qt6-websockets qt6-serialport qt6-scxml qt6-imageformats qt6-connectivity \
            ffmpeg \
            lilv suil lv2 \
            libcoap \
            portaudio \
            pd \
            libfmt spdlog \
            rubberband libsamplerate libsndfile \
            libcoap \
            freetype2 harfbuzz fontconfig \
            alsa-lib jackit
          echo "=============== FreeBSD End install ====================="

        run: |
          set -e
          # The workspace is NFS-shared from the Linux host and the VM runs as
          # root, so directories created by git clone are owned by a foreign
          # uid; without this, the post-clone `git submodule update` for
          # score-addon-airwindows (the one addon that reopens its repo in a
          # second git process, see SKIP_SUBMODULE in ci/common.deps.sh) dies
          # with "detected dubious ownership" and leaves airwin2rack empty,
          # which then breaks the CMake configure.
          git config --global --add safe.directory '*'
          echo "=============== FreeBSD Start Deps ====================="
          ./ci/common.deps.sh FREEBSD
          echo "=============== FreeBSD Deps Success ====================="
          echo "=============== FreeBSD Start Build ====================="
          ./ci/freebsd.build.sh
          echo "=============== FreeBSD Build Success ====================="
          echo "=============== FreeBSD End Build ====================="
