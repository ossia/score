name: Coverage

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage (Coveralls)
    runs-on: [self-hosted, linux, x64, sat-builder]
    container:
      image: ubuntu:26.10

    steps:
      # Once 26.10 is out of support its archive moves to old-releases, and the
      # mirrors of the image answer 404 for it.
      - name: Install git
        run: |
          if ! apt-get update -qq; then
            for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
              [ -f "$f" ] && sed -i -E 's#https?://(archive|security)\.ubuntu\.com#http://old-releases.ubuntu.com#g' "$f"
            done
            apt-get update -qq
          fi
          apt-get install -qq -y --no-install-recommends git ca-certificates curl

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      # The container runs as root while the checkout is owned by a different
      # uid; without this git refuses operations and gcovr --coveralls (which
      # embeds git metadata) fails.
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Dependencies
        run: ./ci/coverage.deps.sh

      - name: Build, run tests, generate Coveralls report
        env:
          # LLVM 23 from apt.llvm.org (ci/coverage.deps.sh), which the JIT
          # plug-in builds against. LLVM_DIR because ubuntu.2604.deps.sh also
          # installs the distribution's LLVM 22 development packages.
          CC: clang-23
          CXX: clang++-23
          GCOV: "llvm-cov-23 gcov"
          CMAKEFLAGS: "-DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm"
          # The library the shader-sweep baselines were recorded against
          # (tests/testdata/shader_sweep_baseline_*): bumped together with them.
          # The head of ossia/score-user-library#36, which the baselines need;
          # it stays fetchable from refs/pull/36/head whatever becomes of the
          # branch, and is to be replaced by the merge commit once it lands.
          SCORE_USER_LIBRARY_REF: f73ce686171402f0b441fb2eebad653203f4015c
        run: ./ci/coverage.build.sh

      # Uploads via the Coveralls GitHub App (github.token) — no secret needed
      # for public repos once the App is enabled on ossia/score. Runs even if a
      # test failed so partial coverage is still reported.
      - name: Upload to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.json
          format: coveralls
