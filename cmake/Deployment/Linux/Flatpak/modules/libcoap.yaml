# Needed for CoAP protocol support
name: libcoap
buildsystem: cmake-ninja
builddir: true
config-opts:
  - -Wno-dev
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
  - -DBUILD_SHARED_LIBS=ON
  - -DENABLE_WS=1
  - -DENABLE_DTLS=0
  - -DENABLE_EXAMPLES=0
  - -DENABLE_DOCS=0
  - -DENABLE_OSCORE=0
  - -DENABLE_SERVER_MODE=0
  - -DENABLE_PROXY_CODE=0
  - -DMAX_LOGGING_LEVEL=0
sources:
  - type: archive
    url: https://github.com/obgm/libcoap/archive/refs/tags/v4.3.5b.tar.gz
    sha256: 383a17d8466cee7c1cb1d4dfbffad2651004850b29eb590e9591c7bedd46741d
