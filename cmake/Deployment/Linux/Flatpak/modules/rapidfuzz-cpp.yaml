# Used for fuzzy-matching of various objects in text fields, etc.
name: rapidfuzz-cpp
buildsystem: cmake-ninja
builddir: true
config-opts:
  - -Wno-dev
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
  - -DBUILD_SHARED_LIBS=ON
sources:
