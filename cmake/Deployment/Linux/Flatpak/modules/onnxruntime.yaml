# Shared by score-addon-onnx (including tokenizers) and sherpa-plugins.
# Keep this ABI version aligned with the sherpa prebuilt archives.
# github.com/microsoft/onnxruntime and its release archives are gone; the NuGet
# package carries the same binaries for both arches.
name: onnxruntime
buildsystem: simple
build-commands:
  - |
    set -e
    case "${FLATPAK_ARCH}" in
      x86_64) rid=linux-x64 ;;
      aarch64) rid=linux-arm64 ;;
      *) echo "no onnxruntime for ${FLATPAK_ARCH}"; exit 1 ;;
    esac
    native="runtimes/${rid}/native"
    install -d "${FLATPAK_DEST}/include/onnxruntime" "${FLATPAK_DEST}/lib"
    install -m644 build/native/include/*.h "${FLATPAK_DEST}/include/onnxruntime/"
    install -m755 "${native}/libonnxruntime.so" "${FLATPAK_DEST}/lib/libonnxruntime.so.1.27.1"
    ln -sf libonnxruntime.so.1.27.1 "${FLATPAK_DEST}/lib/libonnxruntime.so.1"
    ln -sf libonnxruntime.so.1 "${FLATPAK_DEST}/lib/libonnxruntime.so"
    install -m755 "${native}/libonnxruntime_providers_shared.so" "${FLATPAK_DEST}/lib/"
  - install -Dm644 LICENSE "${FLATPAK_DEST}/share/licenses/onnxruntime/LICENSE"
  - install -Dm644 ThirdPartyNotices.txt "${FLATPAK_DEST}/share/licenses/onnxruntime/ThirdPartyNotices.txt"
sources:
  - type: archive
    archive-type: zip
    url: https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.27.1/microsoft.ml.onnxruntime.1.27.1.nupkg
    sha256: 9359e46eba4482ded00e678c98f22b68f51bb411d7934f5516d64050edfa3383
    strip-components: 0
