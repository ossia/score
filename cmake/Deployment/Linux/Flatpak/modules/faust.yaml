# Faust audio plug-in support
name: faust
buildsystem: cmake-ninja
subdir: build
config-opts:
  - -Wno-dev
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
  - -DCMAKE_PREFIX_PATH=/usr/lib/sdk/llvm22
  - -DLLVM_CONFIG=/usr/lib/sdk/llvm22/bin/llvm-config
  - -DBUILD_SHARED_LIBS=ON
  - -DINCLUDE_OSC=0
  - -DINCLUDE_HTTP=0
  - -DINCLUDE_EXECUTABLE=0
  - -DINCLUDE_STATIC=0
  - -DINCLUDE_DYNAMIC=1
  - -DINCLUDE_WASM_GLUE=0
  - -DLINK_LLVM_STATIC=0
  - -DINCLUDE_LLVM=1
  - -DC_BACKEND=COMPILER
  - -DCODEBOX_BACKEND=OFF
  - -DCPP_BACKEND=COMPILER
  - -DCMAJOR_BACKEND=OFF
  - -DCSHARP_BACKEND=OFF
  - -DFIR_BACKEND=OFF
  - -DINTERP_BACKEND=OFF
  - -DJAVA_BACKEND=OFF
  - -DJAX_BACKEND=OFF
  - -DJSFX_BACKEND=OFF
  - -DJULIA_BACKEND=OFF
  - -DLLVM_BACKEND="COMPILER;DYNAMIC"
  - -DOLDCPP_BACKEND=OFF
  - -DRUST_BACKEND=OFF
  - -DSDF3_BACKEND=OFF
  - -DVHDL_BACKEND=OFF
  - -DWASM_BACKEND=OFF
sources:
  - type: archive
    url: https://github.com/grame-cncm/faust/releases/download/2.88.0/faust-2.88.0.tar.gz
    sha256: e4e175cf236924b5b7d4784cbb8c50cc01e211159e169655dd9e6d8f92b871d9
