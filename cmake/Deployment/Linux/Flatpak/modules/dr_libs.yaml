# dr_libs needed by ysfx and score
name: dr_libs
buildsystem: simple
no-make-install: true

sources:
  - type: archive
    url: https://github.com/mackron/dr_libs/archive/dfbebc36e7a17a0f9511798c1bd77d96f0e74413.zip
    sha256: 010eee8a070038870e9b18cc0b7ed07b1845ad6b6a3faf92cdefd7a6ff9c3570

build-commands: []
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/include/ dr_mp3.h
  - install -Dm644 -t ${FLATPAK_DEST}/include/ dr_flac.h
  - install -Dm644 -t ${FLATPAK_DEST}/include/ dr_wav.h
