# spdlog
name: spdlog
buildsystem: cmake-ninja
# score links the runtime's fmt; spdlog's bundled copy would be another fmt ABI.
config-opts:
  - -DSPDLOG_FMT_EXTERNAL=ON
  - -DSPDLOG_BUILD_EXAMPLE=OFF

